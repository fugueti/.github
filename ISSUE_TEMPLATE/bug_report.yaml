name: Bug report
description: Something does not work as it should.
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: App version
      description: The version of this app, and of Fugueti Launcher if it is involved.
      placeholder: Fugueti Feed 0.0.1, Fugueti 16.0.3
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Google Pixel 9
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 17 (API 37)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For crashes, `adb logcat -d -b crash` helps a lot. Screenshots and recordings are welcome.
      render: text
